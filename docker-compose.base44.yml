services:
  web:
    image: node:22-slim
    working_dir: /app
    # Bind-mount the cloned source so edits are reflected live.
    volumes:
      - ./:/app
      - node_modules:/app/node_modules
    ports:
      - "3000:8080"
    environment:
      # Let Vite accept the preview's external hostname (Vite >= 6.1 appends this to allowedHosts).
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
    command: sh -c "npm install --no-audit --no-fund && npm run dev -- --host 0.0.0.0 --port 8080"
    restart: unless-stopped

volumes:
  node_modules:
